<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#051923" />
    </linearGradient>

    <linearGradient id="primaryText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0f766e" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Glowing filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.7" stroke-opacity="0.3" />
      <circle cx="40" cy="40" r="1.5" fill="#38bdf8" fill-opacity="0.25" />
    </pattern>

    <style>
      .dynamic-pulse {
        animation: pulseEffect 4s ease-in-out infinite alternate;
      }
      .wave-flow {
        animation: waveFlow 10s linear infinite;
      }
      .node-pulse {
        animation: nodeBlink 3s ease-in-out infinite alternate;
      }
      .orb-float {
        animation: orbMove 8s ease-in-out infinite alternate;
      }
      @keyframes pulseEffect {
        0% { transform: scale(1); opacity: 0.35; }
        100% { transform: scale(1.15); opacity: 0.65; }
      }
      @keyframes waveFlow {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 400; }
      }
      @keyframes nodeBlink {
        0% { opacity: 0.4; r: 4; }
        100% { opacity: 0.9; r: 6.5; }
      }
      @keyframes orbMove {
        0% { transform: translate(0, 0); }
        100% { transform: translate(40px, -25px); }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" fill="url(#bgGradient)" rx="16" />
  <rect width="1200" height="420" fill="url(#grid)" rx="16" />

  <!-- Dynamic / Animated Background Glow Orbs -->
  <g class="orb-float">
    <circle cx="200" cy="90" r="130" fill="url(#accentGlow)" filter="url(#glow)" />
    <circle cx="1020" cy="320" r="150" fill="#6366f1" opacity="0.18" filter="url(#glow)" />
  </g>

  <!-- Animated Data Flow Curves (Background layer) -->
  <g opacity="0.45">
    <path d="M -50 340 Q 250 210 550 330 T 1250 260" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="10 15" class="wave-flow" />
    <path d="M -50 380 Q 350 270 700 370 T 1250 310" fill="none" stroke="#34d399" stroke-width="2" stroke-dasharray="8 12" class="wave-flow" style="animation-duration: 7s; animation-direction: reverse;" />
    <path d="M -50 280 Q 450 180 850 290 T 1250 200" fill="none" stroke="#818cf8" stroke-width="1.8" stroke-dasharray="6 14" class="wave-flow" style="animation-duration: 12s;" />
  </g>

  <!-- Network Nodes & Civic Data Topology (Background / Sides) -->
  <g>
    <!-- Node 1 -->
    <circle cx="120" cy="110" r="5" fill="#38bdf8" class="node-pulse" />
    <line x1="120" y1="110" x2="220" y2="70" stroke="#0284c7" stroke-width="1.5" stroke-opacity="0.4" />
    <circle cx="220" cy="70" r="4" fill="#818cf8" />
    
    <!-- Node 2 -->
    <circle cx="1060" cy="90" r="5" fill="#34d399" class="node-pulse" style="animation-delay: 1s;" />
    <line x1="1060" y1="90" x2="1130" y2="150" stroke="#059669" stroke-width="1.5" stroke-opacity="0.4" />
    <circle cx="1130" cy="150" r="4.5" fill="#38bdf8" />
    <line x1="1060" y1="90" x2="980" y2="130" stroke="#059669" stroke-width="1.2" stroke-opacity="0.3" />
    <circle cx="980" cy="130" r="3.5" fill="#818cf8" />

    <!-- Node 3 bottom left -->
    <circle cx="160" cy="360" r="5" fill="#38bdf8" class="node-pulse" style="animation-delay: 2s;" />
    <line x1="160" y1="360" x2="260" y2="330" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.3" />
    <circle cx="260" cy="330" r="4" fill="#34d399" />
  </g>

  <!-- FOREGROUND CONTENT: Header, Badges, Title, Subtitle, Feature Pills -->
  
  <!-- Civic Tech Tag Top Pill -->
  <g transform="translate(600, 58)">
    <rect x="-140" y="-18" width="280" height="36" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="1.5" />
    <circle cx="-110" cy="0" r="5" fill="#10b981" class="node-pulse" />
    <text x="-95" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#94a3b8" letter-spacing="2">🏛️ CIVIC TECH &amp; OPEN DATA</text>
  </g>

  <!-- Main Title -->
  <g transform="translate(600, 140)">
    <text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="url(#primaryText)" letter-spacing="-0.5">
      Civic Tech &amp; Open Government
    </text>
    <text y="52" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#f8fafc" letter-spacing="-0.2">
      Data Analytics Ecosystem
    </text>
  </g>

  <!-- Subtitle / Tagline -->
  <g transform="translate(600, 240)">
    <text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#cbd5e1">
      Curated Landscape of Enterprise SaaS Solutions &amp; Open-Source Frameworks
    </text>
    <text y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#94a3b8">
      Open Data Portals • Participatory Democracy • Civic GIS • FOIA Requests • Public Budget Auditing
    </text>
  </g>

  <!-- Feature Cards / Domain Pills (Foreground) -->
  <g transform="translate(100, 310)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="215" height="48" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
      <text x="18" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#38bdf8">🌐 Open Data Portals</text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(255, 0)">
      <rect width="235" height="48" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
      <text x="18" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#a78bfa">🗳️ Participatory Democracy</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(510, 0)">
      <rect width="225" height="48" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
      <text x="18" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#34d399">💰 Public Budget Transparency</text>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(755, 0)">
      <rect width="245" height="48" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
      <text x="18" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f472b6">📋 FOIA &amp; Civic Sentiment</text>
    </g>
  </g>

  <!-- Border Frame Glow -->
  <rect width="1196" height="416" x="2" y="2" rx="15" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.3" />
</svg>